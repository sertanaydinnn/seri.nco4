<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>seri.nco — archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #000;
  color: rgba(255,255,255,0.85);
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300;
  min-height: 100vh;
}

/* ── HEADER ──────────────────────────────────────────── */
#header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 28px;
  padding: 28px 40px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.85) 60%, transparent);
  pointer-events: none;
}

#header a, #header span {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300;
  text-decoration: none;
  letter-spacing: 0.4em;
  text-transform: lowercase;
  pointer-events: all;
}

#back-link {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  transition: color 0.3s ease;
}
#back-link:hover { color: rgba(255,255,255,0.9); }

#header-divider {
  font-size: 11px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0;
}

#archive-heading {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
}

/* ── GRID ────────────────────────────────────────────── */
#grid {
  padding: 100px 32px 80px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}

/* ── PHOTO CELL ──────────────────────────────────────── */
.cell {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cell-img {
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background: #0a0a0a;
}

.cell-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.6s ease, opacity 0.4s ease;
  opacity: 0.88;
}

.cell-img:hover img {
  transform: scale(1.04);
  opacity: 1;
}

.cell-label {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300;
  font-size: 10px;
  letter-spacing: 0.25em;
  color: rgba(255,255,255,0.35);
  text-align: center;
  padding-bottom: 4px;
}

/* ── FOOTER COUNT ────────────────────────────────────── */
#footer {
  text-align: center;
  padding: 48px 0 64px;
  font-size: 11px;
  letter-spacing: 0.35em;
  color: rgba(255,255,255,0.2);
  text-transform: lowercase;
}

/* ── RESPONSIVE ──────────────────────────────────────── */
@media (max-width: 1024px) {
  #grid { grid-template-columns: repeat(4, 1fr); gap: 5px; }
}

@media (max-width: 600px) {
  #grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 88px 12px 60px;
  }
  #header { padding: 20px 20px; gap: 16px; }
  .cell-label { font-size: 8px; }
}

</style>
</head>
<body>

<div id="header">
  <a id="back-link" href="index.html">seri.nco</a>
  <span id="header-divider">/</span>
  <span id="archive-heading">archive</span>
</div>

<div id="grid"></div>

<div id="footer" id="footer-count"></div>

<script>
// ── PHOTOS ───────────────────────────────────────────────────────────────────
// Keep this list in order — the index determines the N/1000 number.
// Add new photos to the bottom as you upload them.
const photos = [
  'photo1.jpg',
  'photo2.jpg',
  'photo3.jpg',
  'photo4.jpg',
  'photo5.jpg',
  'photo6.jpg',
  'photo7.jpg',
  'photo8.jpg',
  'photo9.jpg',
  'photo10.jpg',
  'photo11.jpg',
  'photo12.jpg',
  'photo13.jpg',
  'photo14.jpg',
  'photo15.jpg',
  'photo16.jpg',
  // 'photo17.jpg',
  // 'photo18.jpg',
  // keep adding...
];

const GOAL = 1000;

// ── BUILD GRID ───────────────────────────────────────────────────────────────
const grid = document.getElementById('grid');

photos.forEach((src, i) => {
  const n = i + 1; // 1-based

  const cell = document.createElement('div');
  cell.className = 'cell';

  const imgWrap = document.createElement('div');
  imgWrap.className = 'cell-img';

  const img = document.createElement('img');
  img.src = src;
  img.alt = `${n} / ${GOAL}`;
  img.loading = 'lazy';

  imgWrap.appendChild(img);

  const label = document.createElement('div');
  label.className = 'cell-label';
  label.textContent = `${n} / ${GOAL}`;

  cell.appendChild(imgWrap);
  cell.appendChild(label);
  grid.appendChild(cell);
});

// ── FOOTER ───────────────────────────────────────────────────────────────────
const footer = document.getElementById('footer');
footer.textContent = `${photos.length} / ${GOAL}`;
</script>

</body>
</html>
